<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="famGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="#1e293b" />
  <ellipse cx="200" cy="245" rx="175" ry="22" fill="#0f172a" />
  <!-- Large Cabin / Family Tent Structure -->
  <!-- Main High Cabin Body -->
  <polygon points="90,120 310,120 360,230 40,230" fill="url(#famGrad)" stroke="#34d399" stroke-width="3" />
  <!-- Roof Ridge -->
  <polygon points="200,80 90,120 310,120" fill="#047857" stroke="#34d399" stroke-width="2.5" />
  <!-- Canopy Extension -->
  <polygon points="130,120 270,120 290,200 110,200" fill="#f59e0b" opacity="0.9" stroke="#fbbf24" stroke-width="2" />
  <!-- Front Awning Poles -->
  <line x1="110" y1="200" x2="110" y2="240" stroke="#cbd5e1" stroke-width="3.5" />
  <line x1="290" y1="200" x2="290" y2="240" stroke="#cbd5e1" stroke-width="3.5" />
  <!-- Twin Mesh Doors -->
  <rect x="135" y="160" width="55" height="70" rx="4" fill="#064e3b" stroke="#6ee7b7" stroke-width="2" />
  <rect x="210" y="160" width="55" height="70" rx="4" fill="#064e3b" stroke="#6ee7b7" stroke-width="2" />
  <!-- Guy lines -->
  <line x1="200" y1="80" x2="20" y2="240" stroke="#fde047" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="200" y1="80" x2="380" y2="240" stroke="#fde047" stroke-width="2" stroke-dasharray="4,4" />
</svg>
