<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="#1e293b" />
  
  <!-- Camping Lantern / Lampu Tenda -->
  <g transform="translate(130, 60)">
    <!-- Glow aura -->
    <circle cx="40" cy="70" r="65" fill="url(#lampGlow)" />
    <!-- Handle -->
    <path d="M 20 25 C 20 0, 60 0, 60 25" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <!-- Cap -->
    <rect x="15" y="25" width="50" height="15" rx="4" fill="#047857" stroke="#10b981" stroke-width="2" />
    <!-- Glass Bulb -->
    <rect x="22" y="40" width="36" height="50" rx="6" fill="#fef9c3" stroke="#fde047" stroke-width="2" />
    <!-- Filament -->
    <circle cx="40" cy="65" r="8" fill="#f59e0b" />
    <!-- Base -->
    <rect x="12" y="90" width="56" height="25" rx="5" fill="#047857" stroke="#10b981" stroke-width="2" />
  </g>

  <!-- Sleeping Pad / Matras Tiup -->
  <g transform="translate(230, 110)">
    <!-- Rolled Matras -->
    <ellipse cx="60" cy="40" rx="28" ry="45" fill="#0369a1" stroke="#38bdf8" stroke-width="3" />
    <path d="M 60 -5 L 120 40 L 120 130 L 60 85 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <!-- Straps -->
    <rect x="75" y="10" width="8" height="90" fill="#f59e0b" />
    <rect x="100" y="30" width="8" height="90" fill="#f59e0b" />
  </g>
</svg>
