<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="#1e293b" />
  <!-- Ground -->
  <ellipse cx="200" cy="245" rx="160" ry="20" fill="#0f172a" />
  <!-- Dome Body -->
  <path d="M 60 230 C 70 110, 330 110, 340 230 Z" fill="url(#domeGrad)" stroke="#34d399" stroke-width="3" />
  <!-- Crossing Pole Lines -->
  <path d="M 75 230 C 130 120, 270 120, 325 230" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="6,4" />
  <path d="M 100 230 C 140 140, 260 140, 300 230" fill="none" stroke="#94a3b8" stroke-width="2" />
  <!-- Vestibule / Door Opening -->
  <path d="M 150 230 C 160 160, 240 160, 250 230 Z" fill="url(#doorGrad)" />
  <path d="M 170 230 C 175 180, 225 180, 230 230 Z" fill="#78350f" opacity="0.8" />
  <!-- Guy lines & Pegs -->
  <line x1="60" y1="230" x2="35" y2="250" stroke="#fde68a" stroke-width="2" />
  <line x1="340" y1="230" x2="365" y2="250" stroke="#fde68a" stroke-width="2" />
  <circle cx="35" cy="250" r="4" fill="#fbbf24" />
  <circle cx="365" cy="250" r="4" fill="#fbbf24" />
  <!-- Top Vent -->
  <polygon points="180,118 220,118 200,105" fill="#047857" stroke="#34d399" stroke-width="2" />
</svg>
