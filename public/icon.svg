<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="tentOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="tentInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Mountain Silhouettes in Background -->
  <polygon points="60,370 170,230 280,370" fill="#047857" opacity="0.35" />
  <polygon points="230,370 350,190 470,370" fill="#065f46" opacity="0.45" />

  <!-- Stars / Night Sky -->
  <circle cx="120" cy="110" r="4" fill="#fbbf24" opacity="0.8" />
  <circle cx="210" cy="80" r="3" fill="#ffffff" opacity="0.7" />
  <circle cx="380" cy="120" r="5" fill="#fbbf24" opacity="0.9" />
  <circle cx="430" cy="85" r="3" fill="#ffffff" opacity="0.6" />

  <!-- Moon Crescent -->
  <path d="M 370 70 A 32 32 0 1 0 410 115 A 26 26 0 1 1 370 70 Z" fill="#fef08a" opacity="0.95" />

  <!-- Ground Plane -->
  <ellipse cx="256" cy="400" rx="200" ry="24" fill="#064e3b" opacity="0.8" />

  <!-- Main Tent Structure -->
  <g filter="url(#shadow)">
    <!-- Main Tent Triangle Shell -->
    <polygon points="256,130 90,380 422,380" fill="url(#tentOuter)" stroke="#34d399" stroke-width="4" stroke-linejoin="round" />

    <!-- Left Flap Shadow -->
    <polygon points="256,130 90,380 256,380" fill="#065f46" opacity="0.5" />

    <!-- Center Tent Opening / Door (Glowing Warm Interior) -->
    <polygon points="256,190 180,380 332,380" fill="url(#tentInner)" />
    <!-- Inner Dark Shadow -->
    <polygon points="256,220 200,380 312,380" fill="#78350f" opacity="0.9" />

    <!-- Front guy lines & pegs -->
    <line x1="256" y1="130" x2="60" y2="400" stroke="#fde68a" stroke-width="3" stroke-dasharray="4,4" />
    <line x1="256" y1="130" x2="452" y2="400" stroke="#fde68a" stroke-width="3" stroke-dasharray="4,4" />
    <line x1="90" y1="380" x2="70" y2="400" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="422" y1="380" x2="442" y2="400" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <!-- Ridge Pole & Peak Cap -->
    <circle cx="256" cy="130" r="8" fill="#fbbf24" />
  </g>

  <!-- Campfire Beside Tent -->
  <g transform="translate(360, 360)">
    <!-- Logs -->
    <rect x="-18" y="10" width="36" height="7" rx="3.5" transform="rotate(-20)" fill="#78350f" />
    <rect x="-18" y="10" width="36" height="7" rx="3.5" transform="rotate(20)" fill="#92400e" />
    <!-- Flame -->
    <path d="M 0,12 C -10,6 -12,-8 0,-18 C 4,-12 12,-10 8,0 C 12,6 8,12 0,12 Z" fill="#f97316" />
    <path d="M 0,10 C -5,5 -6,-3 0,-10 C 2,-6 6,-5 4,0 C 6,4 4,10 0,10 Z" fill="#fbbf24" />
  </g>
</svg>
